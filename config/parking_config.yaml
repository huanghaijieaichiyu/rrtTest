# 停车场仿真配置文件

# 窗口设置
window:
  width: 1280
  height: 677
  title: "停车场路径规划仿真器"

# 仿真参数
simulation:
  scale: 10  # 像素/米 - 调整为更高的值以匹配图片分辨率
  fps: 60   # 帧率
  dt: 0.05  # 仿真时间步长(秒)
  lookahead: 5.0  # 路径跟踪前瞻距离
  speed_multiplier: 2.0  # 仿真速度倍率

ui:
  fonts:
    ui:
      system:
        - "Noto Sans CJK SC"
        - "WenQuanYi Micro Hei"
        - "Source Han Sans SC"
        - "Droid Sans Fallback"
        - "Microsoft YaHei UI"
        - "Microsoft YaHei"
        - "SimHei"
        - "DengXian"
        - "SimSun"
      files:
        - "NotoSansCJKsc-Regular.otf"
    title:
      system:
        - "Noto Sans CJK SC"
        - "Source Han Sans SC"
        - "WenQuanYi Micro Hei"
        - "Microsoft YaHei UI"
        - "Microsoft YaHei"
        - "DengXian"
      files:
        - "STKAITI.TTF"
        - "NotoSansCJKsc-Regular.otf"
    mono:
      system:
        - "Sarasa Mono SC"
        - "WenQuanYi Zen Hei Mono"
        - "Noto Sans Mono CJK SC"
        - "Noto Sans CJK SC"
        - "Microsoft YaHei UI"
        - "Consolas"
      files:
        - "NotoSansCJKsc-Regular.otf"

# 车辆参数
vehicle:
  length: 4.5     # 车辆长度(米)
  width: 1.8      # 车辆宽度(米)
  wheelbase: 2.7  # 轴距(米)
  dynamics:
    max_speed: 6.0  # 最大前进速度(m/s)
    max_reverse_speed: 1.8  # 最大倒车速度(m/s)
    max_accel: 1.8   # 最大加速度(m/s^2)
    max_brake: 4.2   # 最大制动(m/s^2)
    max_steer: 0.7854  # 最大转向角(弧度)
    steer_rate: 1.95  # 转向建立速度(rad/s)
    rolling_resistance: 0.24
    drag_coefficient: 0.018
    creep_speed: 0.30
    creep_accel: 0.38
    jerk_limit: 4.5
    throttle_response: 1.8
    brake_response: 3.2
    steer_speed_sensitivity: 0.12
  render:
    body_color: [37, 121, 96, 255]
    roof_color: [61, 154, 123, 245]
    window_color: [194, 220, 233, 220]
    window_shadow: [87, 113, 128, 185]
    trim_color: [25, 34, 42, 255]
    wheel_color: [31, 34, 38, 255]
    wheel_hub_color: [186, 194, 201, 255]
    shadow_color: [18, 22, 24, 78]
    headlight_color: [255, 244, 196, 230]
    taillight_color: [220, 63, 52, 230]
    brake_color: [255, 76, 76, 255]
    reverse_color: [146, 228, 255, 255]
    outline_color: [15, 26, 31, 255]

parking:
  final_pose:
    enabled: true
    trigger_distance: 3.2
    position_tolerance: 0.25
    heading_tolerance_deg: 5.0
    stop_speed_tolerance: 0.05
    hold_time: 0.35
    max_duration: 18.0
    max_stagnation_time: 4.0
    max_gear_switches: 2
    minimum_clearance: 0.2
    staging_offset: 1.15
    align_heading_deg: 12.0
    max_stage_speed: 1.0
    max_dock_speed: 0.75
    max_adjust_speed: 0.45
    path_tail_samples: 6

# 停车场布局
parking_lot:
  geometry:
    spot_width: 2.5   # 停车位宽度(m) - 根据图片调整
    spot_length: 5.0  # 停车位长度(m) - 根据图片调整
    lane_width: 8.0  # 车道宽度(m) - 根据图片调整
  spot_width: 2.5   # 停车位宽度(m)
  spot_height: 5.0  # 停车位高度(m)
  spot_margin: 0.5  # 停车位间距(m)
  safety_zone_width: 0.3  # 安全区域宽度(m)
  layout:
    # 第一排停车位 (上排)
    - type: "parking_spot"
      position: [20, 20]
      id: 1
      static: true
      orientation: 90  # 朝向角度(度)
    - type: "parking_spot"
      position: [30, 20]
      id: 2
      orientation: 90
    - type: "parking_spot"
      position: [40, 20]
      id: 3
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [50, 20]
      id: 4
      orientation: 90
    - type: "parking_spot"
      position: [60, 20]
      id: 5
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [70, 20]
      id: 6
      orientation: 90
    - type: "parking_spot"
      position: [80, 20]
      id: 7
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [90, 20]
      id: 8
      orientation: 90
      
    # 第二排停车位 (中排)
    - type: "parking_spot"
      position: [20, 40]
      id: 9
      static: true
      orientation: 270  # 朝向角度(度)
    - type: "parking_spot"
      position: [30, 40]
      id: 10
      static: true
      orientation: 270
    - type: "parking_spot"
      position: [40, 40]
      id: 11
      orientation: 270
    - type: "parking_spot"
      position: [50, 40]
      id: 12
      orientation: 270
    - type: "parking_spot"
      position: [60, 40]
      id: 13
      static: true
      orientation: 270
    - type: "parking_spot"
      position: [70, 40]
      id: 14
      orientation: 270
    - type: "parking_spot"
      position: [80, 40]
      id: 15
      orientation: 270
    - type: "parking_spot"
      position: [90, 40]
      id: 16
      static: true
      orientation: 270
      
    # 第三排停车位 (下排)
    - type: "parking_spot"
      position: [20, 60]
      id: 17
      orientation: 90
    - type: "parking_spot"
      position: [30, 60]
      id: 18
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [40, 60]
      id: 19
      orientation: 90
    - type: "parking_spot"
      position: [50, 60]
      id: 20
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [60, 60]
      id: 21
      orientation: 90
    - type: "parking_spot"
      position: [70, 60]
      id: 22
      static: true
      orientation: 90
    - type: "parking_spot"
      position: [80, 60]
      id: 23
      orientation: 90
    - type: "parking_spot"
      position: [90, 60]
      id: 24
      static: true
      orientation: 90
      
    # 禁止停车区域
    - type: "no_parking"
      position: [10, 30]
      width: 10
      height: 3
    - type: "no_parking"
      position: [100, 50]
      width: 10
      height: 3
  safety:
    boundary_margin: 5.0
    entrance:
      width: 12.0  # 入口宽度(m)
      approach_length: 15.0  # 入口引道长度(m)
  wall_thickness: 0.5  # 墙壁厚度
  margin: 5.0  # 边界margin
  entrance_width: 12.0  # 入口宽度(m)
  entrance_margin: 15.0  # 入口外的安全距离(m)
  colors:
    wall: [80, 80, 80, 255]  # 墙壁颜色 - 深灰色
    parking_spot: [220, 220, 220, 50]  # 停车位颜色 - 浅灰色半透明
    parking_spot_border: [150, 150, 150, 200]  # 停车位边框颜色
    parking_spot_line: [255, 255, 255, 200]  # 停车位线颜色
    no_parking: [200, 200, 200, 150]  # 禁止停车区域颜色
    car_body: [50, 50, 50, 230]  # 被占车位填充色
    safety_zone: [255, 165, 0, 100]  # 安全区域颜色 - 橙色半透明
    target_spot_glow: [76, 161, 255, 70]
    target_spot_border: [76, 161, 255, 255]
    target_pose: [255, 214, 102, 220]
    panel_bg: [250, 248, 243, 235]
    panel_border: [210, 204, 194, 255]
    panel_title: [18, 27, 34, 255]
    text_muted: [88, 96, 103, 255]
    success: [46, 160, 109, 255]
    warning: [214, 146, 52, 255]
    danger: [194, 76, 76, 255]

# 路径规划
path_planning:
  default_algorithm: "rrt_star"  # 使用RRT*算法
  algorithms:
    rrt:
      step_size: 3.0  # 增大步长
      max_iterations: 20000  # 增加最大迭代次数
    rrt_star:
      step_size: 3.0  # 增大步长
      max_iterations: 20000  # 增加最大迭代次数
      rewire_radius: 3.0  # 增大重连接半径
    informed_rrt:
      step_size: 3.0  # 增大步长
      max_iterations: 20000  # 增加最大迭代次数
      focus_ratio: 1.5  # 增大聚焦比例
    timed_rrt:
      step_size: 3.0  # 增大步长
      max_iterations: 20000  # 增加最大迭代次数
      robot_speed: 2.0  # 增大机器人速度

# 控制参数
control:
  default_method: "pid"
  methods:
    pid:
      steer:
        kp: 3
        ki: 0.01
        kd: 2
      speed:
        kp: 5
        ki: 2
        kd: 0.05
    mpc:
      horizon: 10
      dt: 0.1
      weights:
        x: 1.0
        y: 2.0
        heading: 3.0
    lqr:
      Q: [1.0, 10.0, 10.0]
      R: [0.1]
